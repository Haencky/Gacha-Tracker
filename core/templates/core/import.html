{% extends "base.html" %}
{% block title %}Import · {{ block.super }}{% endblock title %}
{% block content %}
    <h1 class="text-2xl font-bold">Import UIGF File</h1>
    <p class="mt-2 text-base-content/70">...</p>
    <div role="alert" class="alert alert-info mt-4">
        <span>Currently not working</span>
    </div>
    <div class="card bg-base-100 mt-4 shadow-sm">
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <fieldset class="fieldset" disabled>
                    <legend class="fieldset-legend">File</legend>
                    <input type="file"
                           name="file"
                           accept="application/json,.json"
                           class="file-input w-full">
                    <p class="label">Supports UIGF v4 in JSON format</p>
                </fieldset>
                <div class="card-actions mt-4 justify-end">
                    <button type="submit" class="btn btn-primary" disabled>Import</button>
                </div>
            </form>
        </div>
    </div>
{% endblock content %}
