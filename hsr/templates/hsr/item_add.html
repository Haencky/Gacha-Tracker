{% extends "hsr/base.html" %}
{% load i18n %}
{% block content %}
    <input type="search"
           name="q"
           class="input w-full"
           hx-get='{% url "hsr:item-add-search" %}'
           hx-trigger="input changed delay:300ms, search"
           hx-target="#candidates"
           placeholder='{% translate "Search item..." %}' />
    <form method="post">
        {% csrf_token %}
        <div id="candidates"
             class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-6 gap-3 mt-4">
            {% include "hsr/partials/item_add_candidate.html" %}
        </div>
    </form>
{% endblock content %}
