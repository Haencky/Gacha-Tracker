services:
  web:
    build: .
    image: ghcr.io/haencky/gacha-tracker
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data: