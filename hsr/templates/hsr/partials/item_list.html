<div class="overflow-x-auto" id="item-list">
    {% if items %}
        <table class="table">
            <!-- head -->
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Path</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                    <!-- row 1 -->
                    <tr>
                        <td>
                            <div class="flex items-center gap-3">
                                <div class="avatar">
                                    <div class="mask mask-squircle h-12 w-12">
                                        {% if item.portrait %}
                                            <img src="{{ item.portrait.url }}" alt="{{ item.name }}" />
                                        {% else %}
                                            {{ item.name }}
                                        {% endif %}
                                    </div>
                                </div>
                                <div>
                                    <div class="font-bold">{{ item.name }}</div>
                                    {% if item.name != item.eng_name %}
                                        <div class="text-sm opacity-50">{{ item.eng_name }}</div>
                                    {% endif %}
                                </div>
                            </div>
                        </td>
                        {% if item.path.icon %}
                            <td>
                                <div class="avatar">
                                    <div class="mask mask-squircle h-12 w-12">
                                        <img src="{{ item.path.icon.url }}" alt="{{ item.path.name }}" />
                                    </div>
                                </div>
                            </td>
                        {% else %}
                            {{ item.path.name }}
                        {% endif %}
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% endif %}
</div>
